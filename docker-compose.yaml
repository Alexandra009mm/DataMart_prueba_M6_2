services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow} -d ${POSTGRES_DB:-airflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  airflow-init:
    image: apache/airflow:3.1.5-python3.12
    container_name: airflow-init
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-bRMPGubLk5hURWgMrh-v4FYXnTw7G1BQF4iEJpGHgnY=}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-dGhpcy1pcy1hLXNlY3VyZS1qd3Qtc2VjcmV0LWtleS0xMjM=}
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: 'true'
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: 'admin:admin'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      _PIP_ADDITIONAL_REQUIREMENTS: "pandas psycopg2-binary sqlalchemy pyarrow"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow connections delete postgres_olap || true
        airflow connections add postgres_olap \
          --conn-type postgres \
          --conn-host postgres \
          --conn-login ${POSTGRES_USER:-airflow} \
          --conn-password ${POSTGRES_PASSWORD:-airflow} \
          --conn-port 5432 \
          --conn-schema ${DB_OLAP_NAME:-datamart_olap}
        airflow variables set retail_currency_default GBP
        airflow variables set retail_batch_size 5000
    restart: "no"

  airflow-standalone:
    image: apache/airflow:3.1.5-python3.12
    container_name: airflow-standalone
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-bRMPGubLk5hURWgMrh-v4FYXnTw7G1BQF4iEJpGHgnY=}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-dGhpcy1pcy1hLXNlY3VyZS1qd3Qtc2VjcmV0LWtleS0xMjM=}
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: 'true'
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: 'admin:admin'
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: '/opt/airflow/simple_auth_manager_passwords.json'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      _PIP_ADDITIONAL_REQUIREMENTS: "pandas psycopg2-binary sqlalchemy pyarrow"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
    ports:
      - "8080:8080"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        python -c "import json; open('/opt/airflow/simple_auth_manager_passwords.json', 'w').write(json.dumps({'admin': 'admin'}))"
        exec airflow standalone
    restart: always

  products-api:
    build: ./api
    container_name: products-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: "5432"
      DB_OLAP_NAME: ${DB_OLAP_NAME:-datamart_olap}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
    ports:
      - "8000:8000"
    restart: always

volumes:
  postgres_data:

